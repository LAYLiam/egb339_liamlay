[workspace]
authors = ["EGB339 Teaching Staff"]
channels = ["conda-forge"]
description = "Assignment 1.6 for EGB339"
name = "assignment1_6"
platforms = ["osx-arm64", "win-64", "linux-64", "osx-64", "linux-aarch64"]
version = "0.1.0"

[tasks.run_tests]
cmd = "python run_tests.py {{ question }}"
args = [{ arg = "question", default = "all" }]
description = "Run all tests, or one question: pixi run run_tests 3"

[dependencies]
python = "3.11.*"
pip = ">=26.0,<27"
numpy = ">=2.4.6,<3"
scipy = ">=1.17.1,<2"
matplotlib = ">=3.10.9,<4"
sympy = ">=1.14.0,<2"
machinevision-toolbox-python = ">=2.0.1,<3"
pytest = ">=9.1.1,<10"
stopit = ">=1.1.2,<2"
opencv = ">=5.0.0,<6"
py-opencv = ">=5.0.0,<6"
gradescope-utils = ">=0.5.0,<0.6"
