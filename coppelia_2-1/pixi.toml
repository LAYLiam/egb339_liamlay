[workspace]
authors = ["Tobias Fischer <info@tobiasfischer.info>"]
channels = ["conda-forge"]
description = "EGB339 Assignment 2.1 practical assignment infrastructure"
name = "EGB339 Assignment 2.1"
platforms = ["osx-arm64", "win-64", "linux-64", "osx-64", "linux-aarch64"]
version = "0.1.0"

[tasks.test-word-typing]
cmd = "python testWordTypingRobot.py"
description = "Test if your code types the word correctly on the simulated robot."

[tasks.teach-robot]
cmd = "python coppeliaRobotTeach.py"
description = "Control the simulated robot's joints manually."

[dependencies]
python = "3.11.*"
pip = ">=26.0,<27"
numpy = ">=2.4.6,<3"
scipy = ">=1.17.1,<2"
matplotlib = ">=3.10.9,<4"
sympy = ">=1.14.0,<2"
machinevision-toolbox-python = ">=2.0.1,<3"
pytest = ">=9.1.1,<10"
stopit = ">=1.1.2,<2"
opencv = ">=5.0.0,<6"
py-opencv = ">=5.0.0,<6"
gradescope-utils = ">=0.5.0,<0.6"
coppeliasim-zmqremoteapi-client = ">=2.0.4,<3"
